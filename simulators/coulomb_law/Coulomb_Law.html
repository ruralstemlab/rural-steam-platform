<html lang="es">
<head>

    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        /* ---------- ESTILOS BASE ---------- */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
        }
        body {
            margin: 0;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);

        }
        header {

        .author {

            color: #7dd3fc;
            letter-spacing: 1px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: stretch; /* Asegura misma altura entre paneles */
        }
        .panel {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 18px 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
            flex: 1;

            display: flex;

        }
        h2 {
            color: #0284c7;

            font-size: 1.45rem;

            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-top: 14px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
            background: white;
        }
        input:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
            outline: none;
        }
        .chargeCard {
            margin-top: 20px;

        }

            content: '';
            position: absolute;
            top: 0;
            left: 0;

        .mainBtn {

        .toolbar {
            display: flex;
            flex-wrap: wrap;

        .toolBtn {

        .toolBtn.active {

        .canvas-wrapper {
            overflow-x: auto;

        }
        canvas {
            display: block;
            width: auto;
            height: auto;
            background: white;
            border-radius: 26px;

        .latex-panel {
            background: linear-gradient(180deg, #f8fafc, #eef2f6);
            padding: 16px;
            border-radius: 24px;

            font-size: 0.95rem;
            flex: 1;               /* Ocupa todo el espacio restante */
            overflow-y: auto;      /* Scroll solo aquí si el contenido excede */

        .formula {
            text-align: center;
            font-size: 1.2rem;
            color: #d97706;

            overflow-x: auto;
            padding: 6px 0;

        .tag {
            background: #cbd5e1;
            padding: 6px 14px;

        @media (max-width: 768px) {
            .container { padding: 12px; gap: 14px; }

        /* Botón y modal del quiz */
        .quiz-launch-btn {
            margin: 20px 16px 24px 16px;

        .quiz-launch-btn:active { transform: scale(0.97); }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;

            display: none;
            justify-content: center;

        .modal-container {
            background: #f8fafc;
            width: 100%;
            max-width: 1100px;

        @media (max-width: 700px) {
            .modal-container { height: 95vh; width: 98%; }
            .quiz-launch-btn { font-size: 1rem; padding: 14px; }
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; }
        body { background: linear-gradient(145deg, #f0f9ff 0%, #e6f0fa 100%); padding: 2rem 1.5rem; min-height: 100vh; }

        .student-card { background: white; border-radius: 2rem; padding: 1.2rem 1.8rem; margin-bottom: 2rem; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05); border: 1px solid #cbdde9; }

        .student-field input:focus { outline: none; border-color: #2c7cb6; box-shadow: 0 0 0 3px rgba(44,124,182,0.2); }

        .btn-pdf { background: #1f6e43; }

<body>
<div class="container">
    <div class="hero">
        <h1>⚡ Ley de Coulomb · Desafío ICFES ⚡</h1>
        <p>15 preguntas | Competencias científicas | Coherencia matemática total</p>
        <div class="motivation-badge" id="motivationPhrase"></div>
    </div>

    <div class="student-card">
        <div class="student-field">
            <label>📝 Nombre completo (obligatorio)</label>
            <input type="text" id="studentName" placeholder="Ej: Marie Curie" autocomplete="off">
        </div>
        <div class="attempt-info" id="attemptDisplay">Intentos restantes: --</div>
    </div>

    <div id="dynamicQuiz"></div>

    <div class="action-buttons">
        <button class="btn" id="submitQuizBtn">✨ Calificar intento ✨</button>
        <button class="btn btn-pdf" id="downloadPDFBtn" disabled>📄 Certificado PDF</button>
    </div>

    <div id="resultPanel" class="score-board" style="display: none;"></div>
    <footer>Designed by Eng. Medina H. A.</footer>
</div>

<script>
    // FRASES MOTIVADORAS (parte motivadora del quiz)
    const motivationalQuotes = [
        "🚀 ¡Eres el próximo Tesla! Electriza este quiz con tu conocimiento.",
        "🧠 Pídele ayuda a tu amigo Einstein… pero sabemos que no la necesitas.",
        "⚡ ¿Qué diría Ampère de ti? Seguro que: '¡Impresionante!'",
        "🌟 Coulomb estaría orgulloso. Demuestra que dominas su ley.",
        "🔋 Maxwell te observa: concéntrate y brilla.",
        "💡 Un pequeño paso para ti, un gran salto para la electrostática.",
        "🎯 ¡Tú puedes! Hasta Faraday confía en tu potencial.",
        "🏆 Este es tu momento: conviértete en leyenda de la física.",
        "📚 Cada respuesta correcta te acerca a ser el próximo genio de la ciencia."
    ];
    function updateMotivationPhrase() {
        const randomIndex = Math.floor(Math.random() * motivationalQuotes.length);
        document.getElementById('motivationPhrase').innerHTML = motivationalQuotes[randomIndex];
    }

    const questionsBank = [
        { text: "Dos cargas puntuales \\(q_1 = +3\\,\\mu C\\) y \\(q_2 = -2\\,\\mu C\\) separadas \\(0.1\\,m\\). La fuerza electrostática (módulo) es:", options: ["\\(5.4\\, N\\) (atracción)", "\\(5.4\\, N\\) (repulsión)", "\\(2.7\\, N\\) (atracción)", "\\(10.8\\, N\\) (atracción)"], correct: 0, competencia: "Uso comprensivo" },
        { text: "En un simulador de Coulomb, la opción 'Campo eléctrico' representa:", options: ["Líneas equipotenciales", "Vectores de campo en cada punto", "Fuerzas entre cargas", "Trayectorias"], correct: 1, competencia: "Indagación" },
        { text: "Fuerza entre \\(4\\,\\mu C\\) y \\(6\\,\\mu C\\) a \\(0.5\\,m\\) (\\(k=9\\times10^9\\)):", options: ["\\(0.864\\, N\\)", "\\(0.432\\, N\\)", "\\(1.728\\, N\\)", "\\(0.216\\, N\\)"], correct: 0, competencia: "Uso comprensivo" },
        { text: "Si la distancia se triplica, la fuerza se reduce:", options: ["9 veces", "3 veces", "6 veces", "no cambia"], correct: 0, competencia: "Explicación" },
        { text: "Campo eléctrico en el punto medio entre \\(+Q\\) y \\(-Q\\), cuando la separación TOTAL entre cargas es \\(d\\):", options: ["\\(\\frac{8kQ}{d^2}\\) hacia la negativa", "Cero", "\\(\\frac{4kQ}{d^2}\\) hacia la positiva", "\\(\\frac{2kQ}{d^2}\\)"], correct: 0, competencia: "Indagación" },
        { text: "Color típico de carga negativa en simuladores:", options: ["Rojo", "Azul", "Verde", "Amarillo"], correct: 1, competencia: "Indagación" },
        { text: "Carga \\(+2\\mu C\\) ejerce \\(0.5 N\\) a \\(0.2 m\\). Hallar la otra carga:", options: ["\\(1.11\\mu C\\)", "\\(2.22\\mu C\\)", "\\(0.55\\mu C\\)", "\\(3.33\\mu C\\)"], correct: 0, competencia: "Uso comprensivo" },
        { text: "Líneas de flujo eléctrico muestran:", options: ["Dirección del campo", "Trayectorias de cargas", "Fuerza neta", "Energía potencial"], correct: 0, competencia: "Explicación" },
        { text: "Duplicando cargas y reduciendo distancia a la mitad, la fuerza se multiplica por:", options: ["16", "8", "4", "2"], correct: 0, competencia: "Uso comprensivo" },
        { text: "Flechas verdes en el simulador representan:", options: ["Campo eléctrico", "Fuerza entre cargas", "Velocidad", "Flujo"], correct: 1, competencia: "Indagación" },
        { text: "Dos cargas \\(+5\\mu C\\) separadas \\(0.3 m\\). El módulo de la fuerza sobre una carga es:", options: ["\\(2.5 N\\) repulsión", "\\(2.5 N\\) atracción", "\\(5 N\\) repulsión", "\\(1.25 N\\) repulsión"], correct: 0, competencia: "Uso comprensivo" },
        { text: "Constante de Coulomb en el vacío:", options: ["\\(9\\times10^9\\)", "\\(8.85\\times10^{-12}\\)", "\\(1.6\\times10^{-19}\\)", "\\(6.67\\times10^{-11}\\)"], correct: 0, competencia: "Uso comprensivo" },
        { text: "Para tres cargas, la fuerza total sobre una es:", options: ["Suma vectorial", "Producto escalar", "Solo la más cercana", "Promedio"], correct: 0, competencia: "Explicación" },
        { text: "Un electrón se sitúa en una región con campo eléctrico uniforme \\(E = 2\\times10^4\\,\\text{N/C}\\). La fuerza sobre el electrón (\\(e=1.6\\times10^{-19}C\\)) es:", options: ["\\(3.2\\times10^{-15}\\,\\text{N}\\) opuesta al campo", "\\(1.6\\times10^{-19}\\,\\text{N}\\) en la dirección del campo", "\\(2\\times10^4\\,\\text{N}\\)", "Cero"], correct: 0, competencia: "Indagación" },
        { text: "Gráfica de E vs r para carga puntual:", options: ["Proporcional a \\(1/r^2\\)", "Proporcional a r", "Lineal decreciente", "Constante"], correct: 0, competencia: "Indagación" }
    ];

    let currentQuizQuestions = [], userAnswers = [], attempts = 0, MAX_ATTEMPTS = 3, quizLocked = false, currentScore = null, currentGrade = null, lastStudentName = "", lastSelections = [];

    function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function buildQuizQuestions() { return questionsBank.map((q, idx) => { const shuffledOpts = shuffleArray([...q.options]); const originalCorrectText = q.options[q.correct]; const newCorrectIdx = shuffledOpts.findIndex(opt => opt === originalCorrectText); return { id: idx, text: q.text, shuffledOptions: shuffledOpts, correctIndex: newCorrectIdx, competencia: q.competencia }; }); }
    function renderQuiz() {
        currentQuizQuestions = buildQuizQuestions();
        userAnswers = new Array(currentQuizQuestions.length).fill(null);
        const container = document.getElementById('dynamicQuiz');
        container.innerHTML = '';
        currentQuizQuestions.forEach((q, idx) => {
            const card = document.createElement('div'); card.className = 'quiz-card';
            card.innerHTML = `<div class="question-header"><span class="q-num">Pregunta ${idx+1}</span><span class="competencia">🏷️ ${q.competencia}</span></div><div class="question-text">${q.text}</div><div class="options" id="opts-${idx}"></div>`;
            container.appendChild(card);
            const optsDiv = document.getElementById(`opts-${idx}`);
            q.shuffledOptions.forEach((opt, optIdx) => {
                const optDiv = document.createElement('div'); optDiv.className = 'option'; optDiv.innerHTML = opt;
                optDiv.addEventListener('click', () => { if (quizLocked) return; optsDiv.querySelectorAll('.option').forEach(o => o.classList.remove('selected')); optDiv.classList.add('selected'); userAnswers[idx] = optIdx; });
                optsDiv.appendChild(optDiv);
            });
        });

<script>
    // ---------- SIMULADOR CON GRÁFICOS ORIGINALES Y MOTOR PEDAGÓGICO MEJORADO ----------
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x+r, y);
            this.lineTo(x+w-r, y);
            this.quadraticCurveTo(x+w, y, x+w, y+r);
            this.lineTo(x+w, y+h-r);
            this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
            this.lineTo(x+r, y+h);
            this.quadraticCurveTo(x, y+h, x, y+h-r);
            this.lineTo(x, y+r);
            this.quadraticCurveTo(x, y, x+r, y);
            return this;
        };
    }

    const k = 9e9;
    let escala = 40;
    let ajusteManualActivo = false;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let mostrarFuerzas = true;
    let mostrarCampo = true;
    let mostrarFlujo = true;
    let mostrarEjes = true;

    window.toggleFuerzas = function(btn) { mostrarFuerzas = !mostrarFuerzas; btn.classList.toggle('active'); simular(); };
    window.toggleCampo = function(btn) { mostrarCampo = !mostrarCampo; btn.classList.toggle('active'); simular(); };
    window.toggleFlujo = function(btn) { mostrarFlujo = !mostrarFlujo; btn.classList.toggle('active'); simular(); };
    window.toggleEjes = function(btn) { mostrarEjes = !mostrarEjes; btn.classList.toggle('active'); simular(); };

    
window.ajustarVista = function(btn) {

        // Detectar cargas muy cercanas y separarlas inteligentemente
        const n = parseInt(document.getElementById('numCargas').value);

        let cargas = [];

        for (let i = 1; i <= n; i++) {

            let x = parseFloat(document.getElementById(`x${i}`).value) || 0;
            let y = parseFloat(document.getElementById(`y${i}`).value) || 0;

            cargas.push({x, y});
        }

        const distanciaMinima = 28; // cm

        for (let i = 0; i < cargas.length; i++) {

            for (let j = i + 1; j < cargas.length; j++) {

                let dx = cargas[j].x - cargas[i].x;
                let dy = cargas[j].y - cargas[i].y;

                let d = Math.hypot(dx, dy);

                // Si están prácticamente encima
                if (d < distanciaMinima) {

                    // Dirección inteligente
                    let angulo = Math.atan2(dy, dx);

                    // Si exactamente iguales
                    if (d < 0.001) {
                        angulo = (Math.PI * 2 * j) / cargas.length;
                    }

                    const separacion = (distanciaMinima - d) / 2 + 10;

                    const ux = Math.cos(angulo);
                    const uy = Math.sin(angulo);

                    cargas[i].x -= ux * separacion;
                    cargas[i].y -= uy * separacion;

                    cargas[j].x += ux * separacion;
                    cargas[j].y += uy * separacion;
                }
            }
        }

        // Reescribir inputs ya separados
        for (let i = 1; i <= n; i++) {

            document.getElementById(`x${i}`).value =
                Number(cargas[i-1].x.toFixed(1));

            document.getElementById(`y${i}`).value =
                Number(cargas[i-1].y.toFixed(1));
        }

        ajusteManualActivo = true;

        btn.classList.add('active');

        simular();
    };




    
    
function actualizarEscalaDinamica(cargas) {

        if (!ajusteManualActivo) return;

        if (!cargas || cargas.length === 0) {
            escala = 40;
            return;
        }

        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;

        cargas.forEach(c => {
            minX = Math.min(minX, c.x);
            maxX = Math.max(maxX, c.x);

            minY = Math.min(minY, c.y);
            maxY = Math.max(maxY, c.y);
        });

        // Tamaño real ocupado
        let ancho = Math.max(0.1, maxX - minX);
        let alto = Math.max(0.1, maxY - minY);

        // Márgenes pequeños para ocupar gran parte del canvas
        ancho *= 1.15;
        alto *= 1.15;

        const escalaX = (canvas.width * 0.82) / ancho;
        const escalaY = (canvas.height * 0.82) / alto;

        escala = Math.min(escalaX, escalaY);

        // Límites inteligentes
        escala = Math.max(35, Math.min(escala, 420));
    }


function transformar(x, y) {
        return { x: canvas.width / 2 + x * escala, y: canvas.height / 2 - y * escala };
    }

    // --- FUNCIONES DE DIBUJO ORIGINALES ---
    function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const step = Math.max(25, escala);
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += step) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += step) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
        if (mostrarEjes) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            ctx.strokeStyle = '#16a34a';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();
            ctx.fillStyle = '#334155';
            ctx.font = '500 14px "Segoe UI"';
            for (let i = 1; i <= 10; i++) {
                ctx.fillText(i, cx + i * step - 6, cy + 22);
                ctx.fillText(-i, cx - i * step - 12, cy + 22);
            }
            for (let i = 1; i <= 7; i++) {
                ctx.fillText(i, cx + 12, cy - i * step + 5);
                ctx.fillText(-i, cx + 12, cy + i * step + 5);
            }
            ctx.fillStyle = '#16a34a';
            ctx.font = 'bold 24px "Segoe UI"';
            ctx.fillText('X', canvas.width - 36, cy - 10);
            ctx.fillText('Y', cx + 18, 35);
        }
    }

    function drawElectricField(cargas) {
        for (let px = 40; px < canvas.width; px += 42) {
            for (let py = 40; py < canvas.height; py += 42) {
                let Ex = 0, Ey = 0;
                cargas.forEach(c => {
                    const cp = transformar(c.x, c.y);
                    const dx = px - cp.x;
                    const dy = py - cp.y;
                    let r2 = dx * dx + dy * dy;
                    r2 = Math.max(r2, 250);
                    const r = Math.sqrt(r2);
                    const E = k * c.q / r2;
                    Ex += E * (dx / r);
                    Ey += E * (dy / r);
                });
                const mag = Math.hypot(Ex, Ey);
                if (mag === 0) continue;
                const ux = Ex / mag;
                const uy = Ey / mag;
                const len = 16;
                const x2 = px + ux * len;
                const y2 = py + uy * len;
                ctx.strokeStyle = '#111827';
                ctx.fillStyle = '#111827';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                const angle = Math.atan2(y2 - py, x2 - px);
                const head = 6;
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - head * Math.cos(angle - Math.PI/6), y2 - head * Math.sin(angle - Math.PI/6));
                ctx.lineTo(x2 - head * Math.cos(angle + Math.PI/6), y2 - head * Math.sin(angle + Math.PI/6));
                ctx.fill();
            }
        }
    }

    function drawForceVectors(cargas) {
        if (cargas.length < 2) return;
        for (let i = 0; i < cargas.length; i++) {
            const c1 = cargas[i];
            const p1 = transformar(c1.x, c1.y);
            for (let j = 0; j < cargas.length; j++) {
                if (i === j) continue;
                const c2 = cargas[j];
                const p2 = transformar(c2.x, c2.y);
                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 0.01) continue;
                let ux = dx / dist;
                let uy = dy / dist;
                if (c1.q * c2.q > 0) { ux *= -1; uy *= -1; }
                const len = 70;
                const offset = 28;
                const x1 = p1.x + ux * offset;
                const y1 = p1.y + uy * offset;
                const x2 = x1 + ux * len;
                const y2 = y1 + uy * len;
                ctx.shadowColor = '#22c55e';
                ctx.shadowBlur = 12;
                const grad = ctx.createLinearGradient(x1, y1, x2, y2);
                grad.addColorStop(0, 'rgba(34,197,94,0.3)');
                grad.addColorStop(0.6, '#16a34a');
                ctx.strokeStyle = grad;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                const angle = Math.atan2(y2 - y1, x2 - x1);
                ctx.fillStyle = '#15803d';
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - 14 * Math.cos(angle - Math.PI/7), y2 - 14 * Math.sin(angle - Math.PI/7));
                ctx.lineTo(x2 - 7 * Math.cos(angle), y2 - 7 * Math.sin(angle));
                ctx.lineTo(x2 - 14 * Math.cos(angle + Math.PI/7), y2 - 14 * Math.sin(angle + Math.PI/7));
                ctx.fill();
                ctx.font = 'bold 13px "Segoe UI"';
                ctx.fillStyle = '#0c4a34';
                ctx.shadowBlur = 0;
                ctx.fillText(`F${i+1}${j+1}`, x2 + 6, y2 - 6);
            }
        }
        ctx.shadowBlur = 0;
    }

    // Líneas de flujo originales con degradado multicolor
    function drawFieldLines(cargas) {
        cargas.forEach(c => {
            const cp = transformar(c.x, c.y);
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 10) {
                ctx.beginPath();
                let x = cp.x + 26 * Math.cos(a);
                let y = cp.y + 26 * Math.sin(a);
                ctx.moveTo(x, y);
                for (let step = 0; step < 110; step++) {
                    let Ex = 0, Ey = 0;
                    cargas.forEach(c2 => {
                        const p2 = transformar(c2.x, c2.y);
                        const dx = x - p2.x;
                        const dy = y - p2.y;
                        let r2 = dx * dx + dy * dy;
                        r2 = Math.max(r2, 80);
                        const r = Math.sqrt(r2);
                        const E = k * c2.q / r2;
                        Ex += E * (dx / r);
                        Ey += E * (dy / r);
                    });
                    const mag = Math.hypot(Ex, Ey);
                    if (mag === 0) break;
                    x += (Ex / mag) * 4.2;
                    y += (Ey / mag) * 4.2;
                    ctx.lineTo(x, y);
                    if (x < 0 || x > canvas.width || y < 0 || y > canvas.height) break;
                }
                const grad = ctx.createLinearGradient(cp.x, cp.y, x, y);
                grad.addColorStop(0, '#3b82f6');
                grad.addColorStop(0.5, '#a855f7');
                grad.addColorStop(1, '#f97316');
                ctx.strokeStyle = grad;
                ctx.lineWidth = 2.2;
                ctx.stroke();
            }
        });
    }

    function drawCharges(cargas) {
        cargas.forEach(c => {
            const p = transformar(c.x, c.y);
            ctx.beginPath();
            ctx.arc(p.x, p.y, 24, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(p.x - 6, p.y - 6, 5, p.x, p.y, 26);

            else { grad.addColorStop(0, '#dbeafe'); grad.addColorStop(1, '#2563eb'); }
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'white';
            ctx.stroke();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 28px "Segoe UI"';

    // --- MODELO PEDAGÓGICO MEJORADO (biografía, desarrollo paso a paso, fuerza por carga) ---
    function actualizarModeloPedagogico(cargas, fuerzasPorCarga) {
        let html = `
            
            <p>La Ley de Coulomb fue formulada por el físico francés <strong>Charles-Augustin de Coulomb</strong> (1736-1806), nacido en Angulema, Francia. Coulomb estudió la interacción entre cargas eléctricas y estableció que la fuerza eléctrica depende directamente del producto de las cargas e inversamente proporcional al cuadrado de la distancia.</p>
            <div class="formula">\\[ \\boxed{ F = k \\frac{|q_1 q_2|}{r^2} } \\]</div>
            <p>donde \\( k = 9\\times10^9 \\; \\text{N·m}^2/\\text{C}^2 \\) es la constante de Coulomb en el vacío. La fuerza es de <strong>atracción</strong> si las cargas tienen signos opuestos, y de <strong>repulsión</strong> si son del mismo signo.</p>
            <hr>
            <h3>📥 Datos de entrada</h3>
        `;
        cargas.forEach(c => {
            html += `<div class="tag">${c.nombre} = ${(c.q*1e6).toFixed(2)} μC</div>
                     <div class="tag">(${c.x_cm} cm, ${c.y_cm} cm)</div>`;
        });
        if(cargas.length >= 2) {
            html += `
            <div style="background:#fff7ed; padding:12px; border-radius:1rem; margin-top:12px; border-left:6px solid #f59e0b;">
                📏 <strong>Conversión de unidades:</strong> las posiciones ingresadas en centímetros (cm) se convierten automáticamente a metros (m) antes de aplicar la Ley de Coulomb, garantizando coherencia con el Sistema Internacional de Unidades.
            </div>

<hr><h3>🧮 Desarrollo matemático paso a paso</h3>`;
            for(let i=0; i<cargas.length; i++) {
                for(let j=i+1; j<cargas.length; j++) {
                    const c1 = cargas[i], c2 = cargas[j];
                    const dx = c2.x - c1.x, dy = c2.y - c1.y;
                    const r = Math.hypot(dx, dy);
                    const F = k * Math.abs(c1.q * c2.q) / (r*r);
                    const tipo = (c1.q * c2.q > 0) ? "repulsión" : "atracción";
                    html += `
                        <div style="background:#eef2ff; border-radius:1rem; padding:12px; margin:12px 0;">
                            <strong>Interacción entre ${c1.nombre} y ${c2.nombre}</strong><br>
                            Distancia: \\( r = \\sqrt{(${c2.x} - ${c1.x})^2 + (${c2.y} - ${c1.y})^2} = ${r.toFixed(4)} \\; m \\)<br>
                            Módulo de la fuerza: \\( F = 9\\times10^9 \\cdot \\frac{|${c1.q.toExponential(2)} · ${c2.q.toExponential(2)}|}{${r.toFixed(4)}^2} = ${F.toFixed(4)} \\; N \\)<br>
                            <span style="color:${tipo==='atracción'?'#2563eb':'#dc2626'}">🔘 ${tipo.toUpperCase()}</span>
                        </div>
                    `;
                }
            }
            html += `<hr><h3>📊 Resultado final</h3>`;
            if(cargas.length === 2) {
                const f = fuerzasPorCarga[0];
                html += `<div class="formula">Magnitud de la fuerza mutua entre las cargas = ${f.FR.toFixed(4)} N</div>`;
                html += `<div class="formula">Dirección: ${f.angulo.toFixed(2)}° respecto al eje X</div>`;
            } else {
                for(let idx=0; idx<cargas.length; idx++) {
                    const f = fuerzasPorCarga[idx];
                    html += `<div class="chargeCard" style="margin-bottom:12px;">
                                <strong>${cargas[idx].nombre}</strong><br>
                                \\( \\displaystyle \\sum F_x = ${f.Fx.toFixed(4)} \\; N \\), 
                                \\( \\displaystyle \\sum F_y = ${f.Fy.toFixed(4)} \\; N \\)<br>
                                \\( F_R = \\sqrt{(${f.Fx.toFixed(4)})^2 + (${f.Fy.toFixed(4)})^2} = ${f.FR.toFixed(4)} \\; N \\)<br>
                                \\( \\theta = \\operatorname{atan2}\\left(${f.Fy.toFixed(4)},${f.Fx.toFixed(4)}\\right) = ${f.angulo.toFixed(2)}^\\circ \\)
                            </div>`;
                }
            }
            html += `<hr><h3>🎓 Interpretación pedagógica</h3>
            <p>Este resultado permite comprender cómo interactúan las cargas eléctricas en el espacio. Cuando las cargas poseen el mismo signo, la interacción genera repulsión; cuando poseen signos opuestos, aparece atracción eléctrica. La magnitud de la fuerza aumenta cuando las cargas son grandes y disminuye rápidamente al aumentar la distancia entre ellas.</p>
            <p>El plano cartesiano y los vectores permiten visualizar la dirección y sentido de la interacción, fortaleciendo la comprensión geométrica y física del fenómeno electrostático.</p>
            <div style="background:#e6f7e6; padding:12px; border-radius:1rem; margin-top:16px;">
                ✨ <strong>Reflexión motivacional</strong>: Como Coulomb, tú también puedes descubrir las leyes que rigen el universo con paciencia y método. ¡Sigue experimentando!
            </div>`;
        } else {
            html += `<p>Se requiere al menos dos cargas para observar la interacción.</p>`;
        }
        document.getElementById('modeloPedagogico').innerHTML = html;
        if(window.MathJax) {
            MathJax.typesetPromise().catch(err => console.warn("MathJax error:", err));
        }
    }

    // --- SIMULACIÓN PRINCIPAL ---
    function simular() {
        drawGrid();
        const n = parseInt(document.getElementById('numCargas').value);
        let cargas = [];
        for (let i = 1; i <= n; i++) {
            let qVal = parseFloat(document.getElementById(`q${i}`).value);
            if (isNaN(qVal)) qVal = (i%2===0 ? -5 : 5);
            const x_cm = parseFloat(document.getElementById(`x${i}`).value) || 0;
            const y_cm = parseFloat(document.getElementById(`y${i}`).value) || 0;

            cargas.push({
                q: qVal * 1e-6,
                x: x_cm / 100,
                y: y_cm / 100,
                x_cm: x_cm,
                y_cm: y_cm,
                nombre: `q${i}`
            });
        }
        actualizarEscalaDinamica(cargas);

        if (mostrarFlujo) drawFieldLines(cargas);
        if (mostrarCampo) drawElectricField(cargas);
        if (mostrarFuerzas) drawForceVectors(cargas);
        drawCharges(cargas);

        // Cálculo de fuerza neta sobre cada carga (vectorial)
        let fuerzasPorCarga = [];
        for (let i = 0; i < cargas.length; i++) {
            let Fx = 0, Fy = 0;
            for (let j = 0; j < cargas.length; j++) {
                if (i === j) continue;
                const c1 = cargas[i], c2 = cargas[j];
                const dx = c2.x - c1.x, dy = c2.y - c1.y;
                const r = Math.hypot(dx, dy);
                if (r === 0) continue;
                const F = k * Math.abs(c1.q * c2.q) / (r * r);
                let ux = dx / r, uy = dy / r;
                if (c1.q * c2.q > 0) { ux *= -1; uy *= -1; }
                Fx += F * ux;
                Fy += F * uy;
            }
            const FR = Math.hypot(Fx, Fy);
            let angulo = Math.atan2(Fy, Fx) * 180 / Math.PI;
            fuerzasPorCarga.push({ Fx, Fy, FR, angulo });
        }
        actualizarModeloPedagogico(cargas, fuerzasPorCarga);
    }

    function generarInputs() {
        const n = parseInt(document.getElementById('numCargas').value);
        const container = document.getElementById('inputs');
        container.innerHTML = '';
        for (let i = 1; i <= n; i++) {
            const positiva = (i % 2 !== 0);
            const defaultValue = positiva ? 5 : -5;
            const defaultX = i * 2;
            const defaultY = i;
            container.innerHTML += `<div class="chargeCard"><div class="chargeTitle">${positiva ? '🔴' : '🔵'} Carga q${i}</div>
                <label>Valor q${i} (μC)</label><input type="number" id="q${i}" value="${defaultValue}" step="0.5">
                <label>Posición x${i} (cm)</label><input type="number" id="x${i}" value="${defaultX}" step="0.5">
                <label>Posición y${i} (cm)</label><input type="number" id="y${i}" value="${defaultY}" step="0.5"></div>`;
        }
        simular();
    }

    document.getElementById('numCargas').addEventListener('change', () => generarInputs());
    window.addEventListener('resize', () => simular());
    generarInputs();

    // Modal y carga del quiz
    const modal = document.getElementById('quizModal');
    const openBtn = document.getElementById('openQuizBtn');
    const closeBtn = document.getElementById('closeQuizModalBtn');
    const iframe = document.getElementById('quizIframe');
    let quizLoaded = false;

    function loadQuizIntoIframe() {
        if (quizLoaded) return;
        const templateContent = document.getElementById('quizFullTemplate').content.cloneNode(true);
        const serializer = new XMLSerializer();
        let htmlString = '';
        templateContent.childNodes.forEach(node => {
            if (node.nodeType === Node.ELEMENT_NODE) htmlString += node.outerHTML;
            else if (node.nodeType === Node.TEXT_NODE) htmlString += node.textContent;
        });
        const blob = new Blob([htmlString], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);
        iframe.src = blobUrl;
        iframe.onload = () => { URL.revokeObjectURL(blobUrl); quizLoaded = true; };
    }

    openBtn.addEventListener('click', () => {
        modal.style.display = 'flex';
        if (!quizLoaded) loadQuizIntoIframe();
    });
    function closeModal() { modal.style.display = 'none'; }
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.style.display === 'flex') closeModal(); });
</script>

<script>

// =====================================================
// PREGUNTAS (20 preguntas tipo ICFES)
// =====================================================
const preguntas=[
{p:"Una masa de 5kg cuelga de una polea ideal. ¿Cuál es el peso aproximado del cuerpo?",o:["5N","9.81N","49.05N","98.1N"],r:2},
{p:"En un sistema de polea ideal, la tensión de la cuerda:",o:["elimina el peso","transmite fuerza a través de la cuerda","depende del color de la polea","desaparece cuando hay equilibrio"],r:1},
{p:"Si el sistema se encuentra en equilibrio, entonces:",o:["la aceleración es positiva","la fuerza neta es diferente de cero","la aceleración es cero","el peso desaparece"],r:2},
{p:"La Segunda Ley de Newton se expresa mediante:",o:["W = mg","Ff = μN","ΣF = ma","v = d/t"],r:2},
{p:"La fuerza peso siempre apunta:",o:["horizontalmente","hacia la cuerda","verticalmente hacia abajo","hacia arriba"],r:2},
{p:"En el simulador, si la masa aumenta, entonces la tensión:",o:["disminuye","aumenta","desaparece","permanece negativa"],r:1},
{p:"Una polea ideal tiene como función principal:",o:["aumentar la gravedad","eliminar la masa","cambiar la dirección de la fuerza","generar aceleración"],r:2},
{p:"En el Diagrama de Cuerpo Libre del punto A aparecen:",o:["únicamente la polea y la cuerda","únicamente las fuerzas que actúan sobre el punto","las paredes y el piso","únicamente el peso"],r:1},
{p:"Si m = 8kg, el peso aproximado será:",o:["78.48N","8N","9.81N","88N"],r:0},
{p:"La unidad de fuerza en el Sistema Internacional es:",o:["Joule","Newton","Pascal","Watt"],r:1},
{p:"En equilibrio mecánico se cumple que:",o:["a ≠ 0","ΣF = 0","m = 0","g = 0"],r:1},
{p:"Cuando en el simulador se mueve el slider de masa, los vectores del D.C.L.:",o:["permanecen iguales","desaparecen","cambian proporcionalmente","cambian de color aleatoriamente"],r:2},
{p:"La gravedad utilizada en la Tierra tiene un valor aproximado de:",o:["1m/s²","5m/s²","9.81m/s²","98m/s²"],r:2},
{p:"Si la fuerza neta sobre un cuerpo es cero, el cuerpo:",o:["necesariamente acelera","puede permanecer en equilibrio","pierde masa","deja de tener peso"],r:1},
{p:"La tensión y el peso tienen:",o:["igual dirección y mismo sentido","sentidos opuestos","diferentes unidades","magnitudes negativas"],r:1},
{p:"En el simulador, el vector rojo representa:",o:["el peso","la gravedad","la tensión","la normal"],r:2},
{p:"La fuerza peso depende de:",o:["la temperatura","el color del cuerpo","la masa y la gravedad","la velocidad"],r:2},
{p:"Si una masa de 10kg se encuentra en equilibrio suspendida por una cuerda ideal, la tensión vale aproximadamente:",o:["10N","98.1N","9.81N","1000N"],r:1},
{p:"El propósito principal del D.C.L. es:",o:["decorar el sistema físico","representar únicamente las fuerzas que actúan","eliminar las ecuaciones","calcular temperatura"],r:1},
{p:"El simulador permite relacionar:",o:["únicamente colores y dibujos","teoría, ecuaciones y análisis físico","gravedad y temperatura","masa y energía nuclear"],r:1}
];

// Variables globales para la evaluación
let respuestasActuales = new Array(20).fill(null);
let intentosRestantes = 3;
let historialResultados = [];

// =====================================================
// FUNCIONES PARA GENERAR EL QUIZ CON BOTONES ELEGANTES
// =====================================================
function cargarEvaluacion() {
    const contenedor = document.getElementById("quiz");
    let html = "";
    preguntas.forEach((p, idx) => {
        html += `<div class="question" id="pregunta-${idx}">
                    <h4>${idx+1}. ${p.p}</h4>
                    <div class="opciones" id="opciones-${idx}">`;
        p.o.forEach((opt, j) => {
            const letra = String.fromCharCode(65+j);
            html += `<div class="option-btn" data-pregunta="${idx}" data-valor="${j}" onclick="seleccionarOpcion(${idx}, ${j})">
                        <span class="option-letter">${letra}.</span> ${opt}
                    </div>`;
        });
        html += `</div></div>`;
    });
    contenedor.innerHTML = html;
    // Restaurar respuestas previas si existen (cuando se reinicia intento)
    for(let i=0; i<preguntas.length; i++) {
        if(respuestasActuales[i] !== null) {
            const btn = document.querySelector(`#opciones-${i} .option-btn[data-valor="${respuestasActuales[i]}"]`);
            if(btn) btn.classList.add('selected');
        }
    }
}

function seleccionarOpcion(indice, valor) {
    // Remover selección de las demás opciones de la misma pregunta
    const contenedor = document.querySelector(`#opciones-${indice}`);
    contenedor.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
    // Marcar la opción clickeada
    const btnSeleccionado = contenedor.querySelector(`.option-btn[data-valor="${valor}"]`);
    if(btnSeleccionado) btnSeleccionado.classList.add('selected');
    // Guardar respuesta
    respuestasActuales[indice] = valor;
}

// =====================================================
// CALIFICAR EVALUACIÓN
// =====================================================
function obtenerInterpretacion(nota) {
    if(nota < 3) return "⚠️ Desempeño bajo. Se recomienda repasar los conceptos de poleas y Segunda Ley de Newton.";
    if(nota < 4) return "🟡 Desempeño básico. Aún hay aspectos por mejorar en el análisis de fuerzas.";
    return "🚀 ¡Excelente! Dominas los conceptos de equilibrio, tensión y diagramas de cuerpo libre.";
}

function calificarEvaluacion() {
    if(intentosRestantes <= 0) {
        alert("⚠️ Límite máximo de intentos alcanzado (3).");
        return;
    }
    const nombreInput = document.getElementById("nombreEstudiante");
    const nombre = nombreInput.value.trim();
    if(nombre === "") {
        alert("❌ Por favor, ingresa el nombre completo del estudiante antes de calificar.");
        nombreInput.focus();
        return;
    }

    let correctas = 0;
    preguntas.forEach((p, i) => {
        const respuesta = respuestasActuales[i];
        if(respuesta !== null && respuesta === p.r) correctas++;
    });

    const nota = ((correctas / 20) * 5).toFixed(2);
    const notaNum = parseFloat(nota);
    const interpretacion = obtenerInterpretacion(notaNum);
    intentosRestantes--;

    document.getElementById("contadorIntentos").innerHTML = `Intentos restantes: <b>${intentosRestantes}</b>`;

    const resultadoDiv = document.getElementById("resultadoEvaluacion");
    resultadoDiv.innerHTML = `
        <div class="grade">
            ✅ Correctas: <b>${correctas} / 20</b><br>
            📊 Nota: <b>${nota} / 5.0</b><br><br>
            ${interpretacion}
        </div>
    `;

    // Guardar en historial
    historialResultados.push({
        nombre: nombre,
        fecha: new Date().toLocaleString(),
        nota: notaNum,
        correctas: correctas,
        interpretacion: interpretacion
    });

    if(intentosRestantes <= 0) {
        document.getElementById("btnCalificar").disabled = true;
        document.getElementById("btnCalificar").style.background = "#64748b";
        document.getElementById("contadorIntentos").innerHTML = `⚠️ Intentos agotados`;
    }

    // Reiniciar respuestas para el próximo intento (pero no borrar el DOM visualmente)
    respuestasActuales = new Array(20).fill(null);
    cargarEvaluacion(); // recarga las preguntas sin selecciones
}

// =====================================================
// EXPORTAR PDF (usando jsPDF)
// =====================================================
function exportarPDFEvaluacion() {
    if(historialResultados.length === 0) {
        alert("No hay ninguna evaluación realizada. Primero califica al menos un intento.");
        return;
    }
    const ultimo = historialResultados[historialResultados.length - 1];
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(18);
    doc.text("REPORTE DE EVALUACIÓN - SIMULADOR DE POLEA", 20, 20);
    doc.setFontSize(12);
    doc.text(`Estudiante: ${ultimo.nombre}`, 20, 40);
    doc.text(`Fecha: ${ultimo.fecha}`, 20, 50);
    doc.text(`Nota obtenida: ${ultimo.nota} / 5.0`, 20, 60);
    doc.text(`Aciertos: ${ultimo.correctas} de 20 preguntas`, 20, 70);
    doc.text("Interpretación:", 20, 85);
    doc.setFontSize(11);
    const interpretLines = doc.splitTextToSize(ultimo.interpretacion, 170);
    doc.text(interpretLines, 20, 95);
    doc.save(`Resultado_${ultimo.nombre.replace(/\s/g, "_")}.pdf`);
}

// =====================================================
// EXPORTAR EXCEL (CSV con historial)
// =====================================================
function exportarExcelEvaluacion() {
    if(historialResultados.length === 0) {
        alert("No hay evaluaciones previas para exportar.");
        return;
    }
    let csv = "Nombre,Fecha,Nota (5.0),Aciertos/20,Interpretación\n";
    historialResultados.forEach(r => {
        csv += `"${r.nombre}","${r.fecha}",${r.nota},${r.correctas}/20,"${r.interpretacion}"\n`;
    });
    const blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Evaluaciones_Polea_${new Date().toISOString().slice(0,19)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

// =====================================================
// PARTE FÍSICA DEL SIMULADOR (NO MODIFICADA)
// =====================================================
const fisico = document.getElementById("fisico");
const ctx = fisico.getContext("2d");
const dcl = document.getElementById("dcl");
const ctx2 = dcl.getContext("2d");

function flecha(c,x1,y1,x2,y2,color,g=4){
    c.strokeStyle=color;
    c.fillStyle=color;
    c.lineWidth=g;
    c.beginPath();
    c.moveTo(x1,y1);
    c.lineTo(x2,y2);
    c.stroke();
    const ang=Math.atan2(y2-y1,x2-x1);
    c.beginPath();
    c.moveTo(x2,y2);
    c.lineTo(x2-12*Math.cos(ang-Math.PI/6), y2-12*Math.sin(ang-Math.PI/6));
    c.lineTo(x2-12*Math.cos(ang+Math.PI/6), y2-12*Math.sin(ang+Math.PI/6));
    c.closePath();
    c.fill();
}

function etiqueta(c,x,y,texto,fondo,color){
    c.font="bold 14px Arial";
    const p=8;
    const w=c.measureText(texto).width+p*2;
    const h=30;
    c.fillStyle=fondo;
    c.beginPath();
    c.roundRect(x,y,w,h,10);
    c.fill();
    c.strokeStyle=color;
    c.lineWidth=2;
    c.stroke();
    c.fillStyle=color;
    c.fillText(texto,x+p,y+20);
}

function render(){
    const m = +masa.value;
    massTxt.innerText = m;
    const g = 9.81;
    const F = (m*g).toFixed(2);
    
    // PEDAGOGIA
    pedagogia.innerHTML = `
        <div class="sec">
            <div class="secTitle">1. Datos de entrada</div>
            <div class="box">
                <span style="color:green;">\\[ m = ${m} kg \\]</span>
                <span style="color:#2563eb;">\\[ g = 9.81 m/s^2 \\]</span>
            </div>
        </div>
        <div class="sec">
            <div class="secTitle">2. Aplicación de la Segunda Ley de Newton</div>
            <div class="box">
                \\[ \\sum F = ma \\]
                Como el sistema está suspendido y no presenta movimiento: \\[ a=0 \\] 
                Entonces: \\[ \\sum F=0 \\] Esto significa que las fuerzas se encuentran balanceadas.
            </div>
        </div>
        <div class="sec">
            <div class="secTitle">3. Sumatoria de fuerzas en el eje Y</div>
            <div class="box">
                Las fuerzas que actúan son: <span style="color:red;">Tensión</span> \\( F \\) y <span style="color:green;">Peso</span> \\( W \\).<br>
                Aplicando equilibrio: \\[ F - W = 0 \\] \\[ F = W \\]
            </div>
        </div>
        <div class="sec">
            <div class="secTitle">4. Desarrollo matemático paso a paso</div>
            <div class="box">
                El peso se calcula: \\[ W = mg \\] Sustituimos: \\[ W = (${m})(9.81) = ${F} N \\] Como \\( F = W \\), entonces \\[ F = ${F} N \\]
            </div>
        </div>
        <div class="sec">
            <div class="secTitle">5. Interpretación física</div>
            <div class="result">
                ✅ La tensión de la cuerda es igual al peso del bloque.<br>
                ✅ La polea únicamente cambia la dirección de la fuerza.<br>
                ✅ El sistema permanece en equilibrio.<br>
                ✅ No existe aceleración porque las fuerzas están balanceadas.
                <div class="final">\\[ F = ${F} N \\]</div>
            </div>
        </div>
    `;
    if(window.MathJax) MathJax.typesetPromise();

    // DIAGRAMA FÍSICO
    ctx.clearRect(0,0,400,320);
    ctx.fillStyle="white";
    ctx.fillRect(0,0,400,320);
    flecha(ctx,60,40,60,90,"#2563eb",4);
    etiqueta(ctx,10,5,"g = 9.81","#dbeafe","#1d4ed8");
    ctx.strokeStyle="#111";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(80,160);
    ctx.lineTo(250,160);
    ctx.stroke();
    for(let i=80;i<250;i+=12){
        ctx.beginPath();
        ctx.moveTo(i,160);
        ctx.lineTo(i+7,168);
        ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(250,160);
    ctx.lineTo(250,280);
    ctx.stroke();
    for(let i=160;i<280;i+=12){
        ctx.beginPath();
        ctx.moveTo(250,i);
        ctx.lineTo(258,i+7);
        ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(280,125,28,0,2*Math.PI);
    ctx.fillStyle="#d1d5db";
    ctx.fill();
    ctx.strokeStyle="#111";
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(280,125,7,0,2*Math.PI);
    ctx.fillStyle="#111";
    ctx.fill();
    ctx.strokeStyle="red";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(120,125);
    ctx.lineTo(280,125);
    ctx.lineTo(280,220);
    ctx.stroke();
    flecha(ctx,120,125,60,125,"red",4);
    etiqueta(ctx,5,108,"F = ?","#fee2e2","#991b1b");
    ctx.fillStyle="#16a34a";
    ctx.fillRect(258,220,44,44);
    ctx.strokeStyle="#14532d";
    ctx.lineWidth=3;
    ctx.strokeRect(258,220,44,44);
    ctx.beginPath();
    ctx.arc(280,220,6,0,2*Math.PI);
    ctx.fillStyle="black";
    ctx.fill();
    ctx.fillStyle="black";
    ctx.font="bold 16px Arial";
    ctx.fillText("A",292,220);
    etiqueta(ctx,310,228,`m=${m}kg`,"#dcfce7","#166534");

    // DCL
    ctx2.clearRect(0,0,400,300);
    ctx2.fillStyle="white";
    ctx2.fillRect(0,0,400,300);
    const cx=200, cy=150;
    flecha(ctx2,60,cy,340,cy,"black",2);
    flecha(ctx2,cx,260,cx,50,"black",2);
    ctx2.fillStyle="black";
    ctx2.font="bold 18px Arial";
    ctx2.fillText("X",350,154);
    ctx2.fillText("Y",205,40);
    ctx2.beginPath();
    ctx2.arc(cx,cy,8,0,2*Math.PI);
    ctx2.fillStyle="black";
    ctx2.fill();
    ctx2.fillText("A",215,145);
    const esc = Math.min(90, 40+m*4);
    flecha(ctx2,cx,cy,cx,cy-esc,"red",4);
    ctx2.fillStyle="red";
    ctx2.font="bold 24px Arial";
    ctx2.fillText("T",cx+16,cy-esc+8);
    flecha(ctx2,cx,cy,cx,cy+esc,"green",4);
    ctx2.fillStyle="green";
    ctx2.fillText("W",cx+16,cy+esc);
}

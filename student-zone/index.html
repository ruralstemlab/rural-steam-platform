<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Zona de Estudiantes | Resultados ICFES PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            padding: 30px 20px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .card {
            background: #1e293b;
            border-radius: 28px;
            padding: 28px;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }
        .card h2 {
            color: #60a5fa;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.85rem;
            overflow-x: auto;
            display: block;
        }
        th, td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        th {
            background: #0f172a;
            color: #facc15;
        }
        .rank1 { background: #ca8a04; }
        .rank2 { background: #64748b; }
        .rank3 { background: #92400e; }
        .fortaleza { background: #14532d; color: #bbf7d0; }
        .debilidad { background: #7f1a1a; color: #fecaca; }
        .table-responsive { overflow-x: auto; }
        .btn-print {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: inline-block;
        }
        .btn-print:hover {
            background: #2563eb;
        }
        .mensaje-vacio {
            background: #fef9e3;
            color: #1e293b;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #1e293b;
            padding-top: 20px;
        }
        @media (max-width: 700px) {
            body { padding: 20px; }
            th, td { padding: 8px 4px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 Mis Resultados - Simulacro ICFES</h1>
        <p>Resultados publicados por tu profesor</p>
    </div>

    <div id="contenidoResultados"></div>

    <div style="text-align: center;">
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
    </div>

    <footer>
        🔷 Rural STEAM Lab — Resultados oficiales del simulacro
    </footer>
</div>

<script>
    function cargarResultados() {
        const guardado = localStorage.getItem('icfes_resultados_publicos');
        const contenedor = document.getElementById('contenidoResultados');

        if (!guardado) {
            contenedor.innerHTML = `
                <div class="card mensaje-vacio">
                    <h2>📭 No hay resultados disponibles</h2>
                    <p>Tu profesor aún no ha publicado los resultados de este simulacro. Por favor, consulta con él.</p>
                </div>
            `;
            return;
        }

        const data = JSON.parse(guardado);
        const estudiantes = data.estudiantes;
        const areas = data.areas;

        if (!estudiantes || estudiantes.length === 0) {
            contenedor.innerHTML = `<div class="card mensaje-vacio"><p>No hay datos de estudiantes.</p></div>`;
            return;
        }

        // Ordenar por nota (ya vienen ordenados, pero por si acaso)
        estudiantes.sort((a,b) => b.notaGlobalSobre100 - a.notaGlobalSobre100);

        // 1. Tabla de ranking
        let rankingHtml = `
            <div class="card">
                <h2>🏆 Ranking del simulacro</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr><th>#</th><th>Estudiante</th><th>Aciertos</th><th>Nota /100</th>
                `;
        areas.forEach(area => { rankingHtml += `<th>${area}</th>`; });
        rankingHtml += `<th>Suma áreas<br>(0-500)</th><th>Área fuerte</th><th>Área débil</th></thead><tbody>`;

        estudiantes.forEach((e, i) => {
            let clase = i === 0 ? 'rank1' : (i === 1 ? 'rank2' : (i === 2 ? 'rank3' : ''));
            let medalla = i === 0 ? '🥇 ' : (i === 1 ? '🥈 ' : (i === 2 ? '🥉 ' : ''));
            rankingHtml += `<tr class="${clase}">
                <td>${medalla}${i+1}</td>
                <td>${e.nombre}</td>
                <td>${e.aciertos}/${e.totalPreguntas}</td>
                <td>${e.notaGlobalSobre100.toFixed(2)}%</td>`;
            for (let area of areas) {
                rankingHtml += `<td>${e.puntajesAreas[area] || 0}</td>`;
            }
            rankingHtml += `<td>${e.sumaPuntajes}</td>
                <td>${e.areaFuerte}</td>
                <td>${e.areaDebil}</td>
            </tr>`;
        });
        rankingHtml += `</tbody></table></div></div>`;

        // 2. Fortalezas y debilidades por estudiante
        let analisisHtml = `<div class="card"><h2>📌 Fortalezas y Debilidades</h2>
            <div class="table-responsive"><table>
            <thead><tr><th>Estudiante</th><th>Fortaleza (puntaje)</th><th>Debilidad (puntaje)</th><th>Recomendación</th></tr></thead><tbody>`;
        for (let e of estudiantes) {
            let recomendacion = '';
            let puntDebil = e.puntajesAreas[e.areaDebil];
            if (puntDebil < 60) recomendacion = `Reforzar urgentemente ${e.areaDebil} (puntaje bajo). Trabajar competencias básicas.`;
            else if (puntDebil < 70) recomendacion = `Mejorar en ${e.areaDebil} con práctica específica.`;
            else recomendacion = `Mantener nivel en ${e.areaDebil} y seguir profundizando en ${e.areaFuerte}.`;
            analisisHtml += `<tr>
                <td>${e.nombre}</td>
                <td class="fortaleza">${e.areaFuerte} (${e.puntajesAreas[e.areaFuerte]})</td>
                <td class="debilidad">${e.areaDebil} (${puntDebil})</td>
                <td>${recomendacion}</td>
            </tr>`;
        }
        analisisHtml += `</tbody></table></div></div>`;

        // 3. Matriz de riesgo grupal
        let matrizHtml = `<div class="card"><h2>⚠️ Matriz de Riesgo (áreas con promedio < 60)</h2>`;
        let areasCriticas = [];
        for (let area of areas) {
            let suma = 0, count = 0;
            for (let e of estudiantes) {
                suma += e.puntajesAreas[area] || 0;
                count++;
            }
            let promedio = suma / count;
            if (promedio < 60) areasCriticas.push({ area, promedio: promedio.toFixed(1) });
        }
        if (areasCriticas.length === 0) {
            matrizHtml += `<p>✅ No hay áreas críticas. El grupo tiene buen desempeño general.</p>`;
        } else {
            matrizHtml += `<div class="table-responsive"><table><thead><tr><th>Área</th><th>Promedio grupal</th><th>Recomendación pedagógica</th></tr></thead><tbody>`;
            for (let crit of areasCriticas) {
                matrizHtml += `<tr><td>${crit.area}</td><td>${crit.promedio}%</td><td>Priorizar nivelación en ${crit.area}. Talleres específicos.</td></tr>`;
            }
            matrizHtml += `</tbody></table></div>`;
        }
        matrizHtml += `</div>`;

        // 4. Interpretación general
        const promedioGlobal = estudiantes.reduce((a,b) => a + b.notaGlobalSobre100, 0) / estudiantes.length;
        let interpretacionHtml = `<div class="card"><h2>📊 Interpretación Pedagógica General</h2>
            <p>Promedio global del grupo: <strong>${promedioGlobal.toFixed(2)}%</strong>.</p>`;
        if (promedioGlobal >= 80) interpretacionHtml += `<p>🌟 El grupo tiene un desempeño sobresaliente. ¡Felicidades!</p>`;
        else if (promedioGlobal >= 60) interpretacionHtml += `<p>📈 El grupo tiene un desempeño aceptable. Se recomienda reforzar las áreas con menor puntaje.</p>`;
        else interpretacionHtml += `<p>⚠️ El grupo presenta dificultades significativas. Se necesita intervención pedagógica urgente.</p>`;
        interpretacionHtml += `</div>`;

        contenedor.innerHTML = rankingHtml + analisisHtml + matrizHtml + interpretacionHtml;
    }

    cargarResultados();
</script>
</body>
</html>

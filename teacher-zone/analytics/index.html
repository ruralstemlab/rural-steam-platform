.topbar a{

.topbar a{

h2{

.container{

gap:20px;

padding:12px 16px;

background:#22c55e;

table{

background:#0f172a;

overflow:hidden;

td,th{
border:1px solid #334155;
padding:8px;
text-align:center;
color:white;
}

background:#020617;
color:#38bdf8;
}

.superior{
background:#14532d;
color:#bbf7d0;
font-weight:600;
}

.alto{
background:#713f12;
color:#fde68a;
font-weight:600;
}

.basico{
background:#7c2d12;
color:#fdba74;
font-weight:600;
}

background:#7f1d1d;
color:#fecaca;

pre{
white-space:pre-wrap;
background:#0f172a;
padding:15px;

<body>

<div class="topbar">

<button onclick="window.location.href='../'">
⬅ Back to Teacher Zone
</button>

<a href="index.html" download>
📥 Download Offline
</a>

</div>

<h2>
📊 Teacher Evaluation Tools V3
</h2>

<div class="container">

<div class="left">

<textarea id="clave" placeholder="Clave (horizontal o vertical)"></textarea>

<textarea id="tablaInput" placeholder="Nombre + respuestas"></textarea>

<button onclick="calcular()">Calcular</button>

<button onclick="exportarExcel()">Excel</button>

<button onclick="exportarPDF()">PDF</button>

<button onclick="location.reload()">Nuevo</button>

<table>

<thead>
<tr>
<th>#</th>
<th>Nombre</th>
<th>Aciertos</th>
<th>Nota</th>
<th>Nivel</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

</div>

<div class="right">

<table>
<tr><td>Promedio</td><td id="promedio"></td></tr>
<tr><td>Mejor</td><td id="mejor"></td></tr>
<tr><td>Peor</td><td id="peor"></td></tr>
<tr><td>Total</td><td id="total"></td></tr>
</table>

<canvas id="grafico"></canvas>

<pre id="interpretacion"></pre>

<h3>
📘 Análisis por ítems
</h3>

<div id="analisisItems"></div>

</div>

</div>

<script>

let chart;

function esValida(r){
return ["A","B","C","D"].includes(r.toUpperCase());
}

function parseClave(text){
if(text.includes("\n")){
return text.split("\n").map(x=>x.trim()).filter(x=>x!="");
}
return text.trim().split(/\s+|\t|,/).filter(x=>x!="");
}

function parseLinea(linea){

if(linea.includes("\t")) return linea.split("\t");

let partes=linea.trim().split(/\s+/);

let idx=partes.findIndex(p=>esValida(p));

if(idx===-1) return [];

let nombre=partes.slice(0,idx).join(" ");

let resp=partes.slice(idx);

return [nombre,...resp];
}

function calcular(){

let clave=parseClave(document.getElementById("clave").value.trim());

for(let c of clave){
if(!esValida(c)){
alert("Clave inválida");
return;
}
}

let lineas=document.getElementById("tablaInput").value.trim().split("\n");

let estudiantes=[];

let conteo={
SUPERIOR:0,
ALTO:0,
BASICO:0,
BAJO:0
};

window.estadisticasItems=[];

lineas.forEach(l=>{

let d=parseLinea(l);

if(d.length<2)return;

let nombre=d[0];

let resp=d.slice(1);

let total=Math.min(clave.length,resp.length);

if(total===0)return;

let aciertos=0;

for(let i=0;i<total;i++){

if(!window.estadisticasItems[i]){
window.estadisticasItems[i]={
correctas:0,
total:0
};
}

}

for(let i=0;i<total;i++){

if(!resp[i] || resp[i].trim()==="") continue;

if(!esValida(resp[i])) continue;

window.estadisticasItems[i].total++;

if(clave[i].toUpperCase()===resp[i].toUpperCase()){

aciertos++;

window.estadisticasItems[i].correctas++;

}

}

let nota=(aciertos/total)*5;

let nivel="",clase="";

if(nota>=4){
nivel="SUPERIOR";
clase="superior";
}
else if(nota>=3.5){
nivel="ALTO";
clase="alto";
}
else if(nota>=3){
nivel="BASICO";
clase="basico";
}
else{
nivel="BAJO";
clase="bajo";
}

conteo[nivel]++;

estudiantes.push({
nombre,
aciertos,
total,
nota,
nivel,
clase
});

});

if(estudiantes.length===0){
alert("No hay datos válidos");
return;
}

estudiantes.sort((a,b)=>b.nota-a.nota);

tabla.innerHTML="";

estudiantes.forEach((e,i)=>{

tabla.innerHTML+=`
<tr class="${e.clase}">
<td>${i+1}</td>
<td>${e.nombre}</td>
<td>${e.aciertos}/${e.total}</td>
<td>${e.nota.toFixed(2)}</td>
<td>${e.nivel}</td>
</tr>
`;

});

let notas=estudiantes.map(e=>e.nota);

let prom=notas.reduce((a,b)=>a+b,0)/notas.length;

promedio.innerText=prom.toFixed(2);

mejor.innerText=Math.max(...notas).toFixed(2);

peor.innerText=Math.min(...notas).toFixed(2);

total.innerText=notas.length;

let dispersion=Math.max(...notas)-Math.min(...notas);

let totalEst=estudiantes.length;

let pBajo=(conteo.BAJO/totalEst)*100;
let pBasico=(conteo.BASICO/totalEst)*100;
let pAlto=(conteo.ALTO/totalEst)*100;
let pSuperior=(conteo.SUPERIOR/totalEst)*100;

let texto="🧠 ANÁLISIS PEDAGÓGICO\n\n";

texto+=`Promedio: ${prom.toFixed(2)}\n`;
texto+=`Dispersión: ${dispersion.toFixed(2)}\n\n`;

texto+=`Distribución:\n`;
texto+=`Superior: ${pSuperior.toFixed(1)}%\n`;
texto+=`Alto: ${pAlto.toFixed(1)}%\n`;
texto+=`Básico: ${pBasico.toFixed(1)}%\n`;
texto+=`Bajo: ${pBajo.toFixed(1)}%\n\n`;

if(pBajo>=40){
texto+="Grupo en nivel crítico con dificultades generalizadas.\n";
}
else if(pBajo+pBasico>=60){
texto+="Grupo en riesgo académico.\n";
}
else if(pAlto+pSuperior>=60){
texto+="Grupo con desempeño adecuado.\n";
}

if(prom<3){
texto+="Promedio bajo.\n";
}
else if(prom<4){
texto+="Proceso en consolidación.\n";
}
else{
texto+="Buen desempeño general.\n";
}

texto+="\nRecomendación: reforzar preguntas con menor porcentaje de acierto.";

interpretacion.innerText=texto;

if(chart) chart.destroy();

chart=new Chart(grafico,{
type:"pie",
data:{
labels:["Superior","Alto","Básico","Bajo"],
datasets:[{
data:[
conteo.SUPERIOR,
conteo.ALTO,
conteo.BASICO,
conteo.BAJO
],
backgroundColor:[
"#22c55e",
"#eab308",
"#f97316",
"#ef4444"
]
}]
},
options:{
plugins:{
datalabels:{
color:"#000",
font:{weight:"bold"},
formatter:(v,ctx)=>{
let t=ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0);
return ((v/t)*100).toFixed(0)+"%";
}
}
}
},
plugins:[ChartDataLabels]
});

let cont=document.getElementById("analisisItems");

cont.innerHTML="";

window.estadisticasItems.forEach((it,i)=>{

let p=it.total?it.correctas/it.total:0;

let nivel=p>=0.8?"Fácil":p>=0.5?"Media":"Difícil";

let color=p>=0.8?"#22c55e":p>=0.5?"#facc15":"#ef4444";

cont.innerHTML+=`
<div style="margin:6px 0;">
Pregunta ${i+1}: ${(p*100).toFixed(1)}%
→ <b style="color:${color}">${nivel}</b>
</div>
`;

});

}

function exportarPDF(){

const {jsPDF}=window.jspdf;

let doc=new jsPDF();

doc.setFontSize(16);

doc.text("Teacher Evaluation Tools V3",10,10);

doc.setFontSize(10);

doc.text("Promedio: "+promedio.innerText,10,20);

let rows=[];

document.querySelectorAll("#tabla tr").forEach(tr=>{

let fila=[];

tr.querySelectorAll("td").forEach(td=>fila.push(td.innerText));

rows.push(fila);

});

doc.autoTable({
head:[["#","Nombre","Aciertos","Nota","Nivel"]],
body:rows,
startY:30,
styles:{fontSize:8}
});

let y=doc.lastAutoTable.finalY || 60;

let img=grafico.toDataURL("image/png");

doc.addImage(img,"PNG",10,y+5,80,80);

let texto=interpretacion.innerText.split("\n");

doc.setFontSize(9);

doc.text(texto,100,y+10);

const pageHeight=doc.internal.pageSize.height;

doc.text("Design by Eng. Medina H. A.",130,pageHeight-10);

doc.save("Reporte.pdf");

}

function exportarExcel(){

let data=[["Ranking","Nombre","Aciertos","Nota","Nivel"]];

document.querySelectorAll("#tabla tr").forEach(tr=>{

let f=[];

tr.querySelectorAll("td").forEach(td=>f.push(td.innerText));

data.push(f);

});

let wb=XLSX.utils.book_new();

let ws=XLSX.utils.aoa_to_sheet(data);

XLSX.utils.book_append_sheet(wb,ws,"Resultados");

XLSX.writeFile(wb,"Reporte.xlsx");

}

</script>

<div class="footer">
Design by Eng. Medina H. A.
</div>

</body>
</html>

<script>
const canvasFisico=document.getElementById("canvasFisico");
const ctxF=canvasFisico.getContext("2d");
const canvasDCL=document.getElementById("canvasDCL");
const ctxD=canvasDCL.getContext("2d");

let desplazamiento=0;
let velocidad=0;
let sistema={};
let intentosRestantes=3;
let historialResultados=[];  // Guarda {nombre, fecha, nota, correctas, interpretacion}
let respuestasActuales = new Array(20).fill(null);

function cambiarModo(){
const modo=document.getElementById("modo").value;
document.querySelector(".campo-fuerza").style.display="block";
document.querySelector(".campo-aceleracion").style.display="block";
document.querySelector(".campo-mu").style.display="block";
if(modo==="aceleracion") document.querySelector(".campo-aceleracion").style.display="none";
if(modo==="fuerza") document.querySelector(".campo-fuerza").style.display="none";
if(modo==="friccion") document.querySelector(".campo-mu").style.display="none";
}

function flecha(ctx,x1,y1,x2,y2,color,g=4){
ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=g;
ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
const ang=Math.atan2(y2-y1,x2-x1);
ctx.beginPath(); ctx.moveTo(x2,y2);
ctx.lineTo(x2-12*Math.cos(ang-Math.PI/6),y2-12*Math.sin(ang-Math.PI/6));
ctx.lineTo(x2-12*Math.cos(ang+Math.PI/6),y2-12*Math.sin(ang+Math.PI/6));
ctx.closePath(); ctx.fill();
}
function etiqueta(ctx,x,y,texto,fondo,color){
ctx.font="bold 15px Arial";
const p=10; const w=ctx.measureText(texto).width+p*2; const h=34;
ctx.fillStyle=fondo;
ctx.beginPath(); ctx.roundRect(x,y,w,h,10); ctx.fill();
ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
ctx.fillStyle=color; ctx.fillText(texto,x+p,y+22);
}

function actualizar(){
const modo=document.getElementById("modo").value;
let m=parseFloat(document.getElementById("masa").value);
let F=parseFloat(document.getElementById("fuerza").value);
let mu=parseFloat(document.getElementById("mu").value);
let a=parseFloat(document.getElementById("aceleracion").value);
let g=parseFloat(document.getElementById("g").value);
const N=m*g;
if(modo==="aceleracion") a=(F-(mu*N))/m;
if(modo==="fuerza") F=m*a+mu*N;
if(modo==="friccion") mu=(F-m*a)/N;
const ff=mu*N;
sistema={m,F,mu,g,a,N,ff};
dibujarFisico();
dibujarDCL();
desarrollo();
}

function dibujarFisico(){
const {m,F,mu,a}=sistema;
ctxF.clearRect(0,0,600,420); ctxF.fillStyle="white"; ctxF.fillRect(0,0,600,420);
const pisoY=320;
ctxF.beginPath(); ctxF.moveTo(40,pisoY); ctxF.lineTo(560,pisoY); ctxF.stroke();
let separacion=Math.max(5,24-mu*16);
for(let i=40;i<560;i+=separacion){ ctxF.beginPath(); ctxF.moveTo(i,pisoY); ctxF.lineTo(i+8,pisoY+6+mu*8); ctxF.stroke(); }
velocidad+=a*0.002; velocidad*=0.985; desplazamiento+=velocidad;
if(desplazamiento>130){ desplazamiento=130; velocidad*=-0.45; }
if(desplazamiento<-130){ desplazamiento=-130; velocidad*=-0.45; }
const bw=120; const bh=90; const bx=230+desplazamiento; const by=pisoY-bh;
ctxF.fillStyle="#10b981"; ctxF.fillRect(bx,by,bw,bh);
ctxF.fillStyle="white"; ctxF.font="bold 22px Arial"; ctxF.fillText(`${m} kg`,bx+30,by+53);
flecha(ctxF,bx+bw,by+bh/2,bx+bw+100,by+bh/2,"red",5);
etiqueta(ctxF,bx+bw+10,by-45,`F = ${F.toFixed(1)} N`,"#fee2e2","#991b1b");
const escalaA=Math.min(120,Math.max(45,Math.abs(a)*55));
if(a>0){ flecha(ctxF,bx+bw/2,by-85,bx+bw/2+escalaA,by-85,"#38bdf8",5); etiqueta(ctxF, Math.min(bx+bw/2+escalaA-20,380), by-130, `a = ${a.toFixed(2)} m/s² →`,"#dbeafe","#0284c7"); }
if(a<0){ flecha(ctxF,bx+bw/2,by-85,bx+bw/2-escalaA,by-85,"#38bdf8",5); etiqueta(ctxF, Math.max(bx+bw/2-escalaA-150,15), by-130, `← a = ${Math.abs(a).toFixed(2)} m/s²`,"#dbeafe","#0284c7"); }
}

function dibujarDCL(){
const {F,ff,N,m,g}=sistema;
ctxD.clearRect(0,0,600,620); ctxD.fillStyle="white"; ctxD.fillRect(0,0,600,620);
const cx=300; const cy=310;
flecha(ctxD,cx,cy,cx+140,cy,"red",5); flecha(ctxD,cx,cy,cx-120,cy,"blue",5);
flecha(ctxD,cx,cy,cx,cy-140,"green",5); flecha(ctxD,cx,cy,cx,cy+140,"orange",5);
ctxD.fillStyle="black"; ctxD.beginPath(); ctxD.arc(cx,cy,14,0,2*Math.PI); ctxD.fill();
etiqueta(ctxD,430,280,`F = ${F.toFixed(1)} N`,"#fee2e2","#991b1b");
etiqueta(ctxD,20,280,`Ff = ${ff.toFixed(1)} N`,"#dbeafe","#1d4ed8");
etiqueta(ctxD,320,110,`N = ${N.toFixed(1)} N`,"#dcfce7","#166534");
etiqueta(ctxD,320,500,`W = ${(m*g).toFixed(1)} N`,"#fef3c7","#92400e");
}

function desarrollo(){
const {m, F, mu, g, a, N, ff} = sistema;
const modo = document.getElementById("modo").value;
let contenido = "";
const paso = (titulo, cuerpo) => `<div class="paso"><strong>📌 ${titulo}</strong><br>${cuerpo}</div>`;
const ec = (texto) => `<div class="ecuacion">${texto}</div>`;
if(modo === "aceleracion"){
contenido = `<div class="tag">🎯 MODO: CALCULAR ACELERACIÓN (a)</div>${paso("1. Datos conocidos", `Masa: m = ${m} kg <br>Fuerza aplicada: F = ${F} N <br>Coeficiente de fricción: μ = ${mu} <br>Gravedad: g = ${g} m/s²`)}${paso("2. Calcular la fuerza normal (N)", `${ec("N = m · g")}Sustitución: N = ${m} kg · ${g} m/s² = <strong>${N.toFixed(2)} N</strong>`)}${paso("3. Calcular la fuerza de fricción cinética (Ff)", `${ec("Ff = μ · N")}Sustitución: Ff = ${mu} · ${N.toFixed(2)} N = <strong>${ff.toFixed(2)} N</strong>`)}${paso("4. Aplicar la Segunda Ley de Newton (ΣF = m·a)", `${ec("F - Ff = m · a")}Despejamos la aceleración: ${ec("a = (F - Ff) / m")}Sustitución: a = (${F} N - ${ff.toFixed(2)} N) / ${m} kg = (${(F-ff).toFixed(2)} N) / ${m} kg = <strong>${a.toFixed(2)} m/s²</strong>`)}${paso("5. Interpretación del resultado", `La aceleración obtenida es ${a.toFixed(2)} m/s². ${a > 0 ? "El bloque se moverá hacia la derecha aumentando su velocidad." : a < 0 ? "El bloque frenará o se moverá hacia la izquierda." : "El bloque permanece en reposo o con velocidad constante (equilibrio)."}`)}<div class="result" style="background:#052e16;border:2px solid #22c55e;color:#4ade80;">🚀 <b>Aceleración del sistema: ${a.toFixed(2)} m/s²</b></div>`;
}
else if(modo === "fuerza"){
contenido = `<div class="tag">🎯 MODO: CALCULAR FUERZA APLICADA (F)</div>${paso("1. Datos conocidos", `Masa: m = ${m} kg <br>Aceleración deseada: a = ${a} m/s² <br>Coeficiente de fricción: μ = ${mu} <br>Gravedad: g = ${g} m/s²`)}${paso("2. Calcular la fuerza normal (N)", `${ec("N = m · g")}N = ${m} kg · ${g} m/s² = <strong>${N.toFixed(2)} N</strong>`)}${paso("3. Calcular la fuerza de fricción (Ff)", `${ec("Ff = μ · N")}Ff = ${mu} · ${N.toFixed(2)} N = <strong>${ff.toFixed(2)} N</strong>`)}${paso("4. Aplicar la Segunda Ley de Newton", `${ec("F = m·a + Ff")}Sustitución: F = (${m} kg · ${a} m/s²) + ${ff.toFixed(2)} N = ${(m*a).toFixed(2)} N + ${ff.toFixed(2)} N = <strong>${F.toFixed(2)} N</strong>`)}${paso("5. Interpretación del resultado", `Para lograr una aceleración de ${a} m/s² sobre una masa de ${m} kg con una fricción de ${ff.toFixed(2)} N, se requiere aplicar una fuerza de <strong>${F.toFixed(2)} N</strong> en la dirección del movimiento.`)}<div class="result" style="background:#052e16;border:2px solid #22c55e;color:#4ade80;">🔧 <b>Fuerza necesaria: ${F.toFixed(2)} N</b></div>`;
}
else if(modo === "friccion"){
contenido = `<div class="tag">🎯 MODO: CALCULAR COEFICIENTE DE FRICCIÓN (μ)</div>${paso("1. Datos conocidos", `Masa: m = ${m} kg <br>Fuerza aplicada: F = ${F} N <br>Aceleración: a = ${a} m/s² <br>Gravedad: g = ${g} m/s²`)}${paso("2. Calcular la fuerza normal (N)", `${ec("N = m · g")}N = ${m} kg · ${g} m/s² = <strong>${N.toFixed(2)} N</strong>`)}${paso("3. Aplicar la Segunda Ley de Newton", `${ec("Ff = F - m·a")}Sustitución: Ff = ${F} N - (${m} kg · ${a} m/s²) = ${F} N - ${(m*a).toFixed(2)} N = <strong>${(F - m*a).toFixed(2)} N</strong>`)}${paso("4. Relacionar fricción con normal para obtener μ", `${ec("μ = Ff / N")}Sustitución: μ = ${(F - m*a).toFixed(2)} N / ${N.toFixed(2)} N = <strong>${mu.toFixed(4)}</strong>`)}${paso("5. Interpretación del resultado", `El coeficiente de fricción entre las superficies es ${mu.toFixed(4)}. ${mu < 0.2 ? "Es una superficie de baja fricción (similar a hielo o teflón)." : mu < 0.5 ? "Fricción moderada (madera sobre madera)." : "Alta fricción (caucho sobre asfalto)."}`)}<div class="result" style="background:#052e16;border:2px solid #22c55e;color:#4ade80;">📊 <b>Coeficiente de fricción μ = ${mu.toFixed(4)}</b></div>`;
}
document.getElementById("pedagogia").innerHTML = contenido;
}

function cargarEvaluacion(){
const cont=document.getElementById("evaluacion");
let html="";
preguntas.forEach((p,i)=>{
html+=`<div class="pregunta" id="pregunta-${i}"><b>Pregunta ${i+1}</b><br><br>${p.q}<div class="opciones" id="opciones-${i}">`;
p.op.forEach((opt, idx) => {
const letra = String.fromCharCode(65+idx); // A, B, C, D
html += `<div class="option-btn" data-pregunta="${i}" data-valor="${letra}" onclick="seleccionarOpcion(${i}, '${letra}')">
<span class="option-letter">${letra}.</span> ${opt}
</div>`;
});
html += `</div></div>`;
});
cont.innerHTML=html;
// Restaurar respuestas seleccionadas previamente si las hay
for(let i=0; i<preguntas.length; i++){
if(respuestasActuales[i]){
const opcionSeleccionada = document.querySelector(`#opciones-${i} .option-btn[data-valor="${respuestasActuales[i]}"]`);
if(opcionSeleccionada) opcionSeleccionada.classList.add('selected');
}
}
}

function seleccionarOpcion(indice, valor){
// Remover selección de las demás opciones de la misma pregunta
const contenedor = document.querySelector(`#opciones-${indice}`);
contenedor.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
// Marcar la opción clickeada
const btnSeleccionado = contenedor.querySelector(`.option-btn[data-valor="${valor}"]`);
if(btnSeleccionado) btnSeleccionado.classList.add('selected');
// Guardar respuesta
respuestasActuales[indice] = valor;
}

function obtenerInterpretacion(nota){
if(nota < 3) return "⚠️ Desempeño bajo. Se recomienda repasar los conceptos de la Segunda Ley de Newton y la fricción.";
if(nota < 4) return "🟡 Desempeño básico. Aún hay aspectos por mejorar, especialmente en la aplicación de fórmulas.";
return "🚀 ¡Excelente! Dominas los conceptos del simulador y la relación entre fuerza, masa y fricción.";
}
function calificarEvaluacion(){
if(intentosRestantes<=0){ alert("⚠️ Límite máximo de intentos alcanzado."); return; }
const nombreInput = document.getElementById("nombreEstudiante");
const nombre = nombreInput.value.trim();
if(nombre === ""){ alert("❌ Por favor, ingresa el nombre completo del estudiante antes de calificar."); nombreInput.focus(); return; }
let correctas=0;
preguntas.forEach((p,i)=>{ const seleccion = respuestasActuales[i]; if(seleccion && seleccion===p.r) correctas++; });
const nota = ((correctas/20)*5).toFixed(2);
const notaNum = parseFloat(nota);
const interpretacion = obtenerInterpretacion(notaNum);
intentosRestantes--;
document.getElementById("contadorIntentos").innerHTML = `Intentos restantes: <b>${intentosRestantes}</b>`;
const resultado = document.getElementById("resultadoEvaluacion");
resultado.style.display = "block";
let color="#22c55e", fondo="#052e16", borde="#22c55e";
if(notaNum<3){ color="#f87171"; fondo="#450a0a"; borde="#ef4444"; }
else if(notaNum<4){ color="#facc15"; fondo="#3f2f00"; borde="#eab308"; }
resultado.style.background = fondo;
resultado.style.border = `2px solid ${borde}`;
resultado.style.color = color;
resultado.innerHTML = `<div style="font-size:1.4rem; font-weight:bold; margin-bottom:12px; text-align:center;">🧠 RESULTADO EVALUACIÓN - ${nombre}</div>
<div style="font-size:1.1rem; margin-bottom:10px;">Correctas: <b>${correctas} / 20</b></div>
<div style="font-size:2.1rem; font-weight:bold; margin:20px 0; text-align:center;">${nota} / 5.0</div>
<div style="background:rgba(255,255,255,0.08); padding:14px; border-radius:14px; font-size:1rem; line-height:1.8;">${interpretacion}</div>`;
historialResultados.push({nombre, fecha: new Date().toLocaleString(), nota: notaNum, correctas, interpretacion});
if(intentosRestantes<=0){
document.getElementById("btnCalificar").disabled = true;
document.getElementById("btnCalificar").style.background = "#64748b";
document.getElementById("contadorIntentos").innerHTML = `⚠️ Intentos agotados`;
}
// Reiniciar respuestas para el próximo intento
respuestasActuales = new Array(20).fill(null);
cargarEvaluacion(); // recarga las preguntas sin selecciones
}

function exportarPDFEvaluacion() {
if(historialResultados.length === 0){
alert("No hay ninguna evaluación realizada. Primero califica al menos un intento.");
return;
}
const ultimo = historialResultados[historialResultados.length - 1];
const { jsPDF } = window.jspdf;
const doc = new jsPDF();
doc.setFontSize(18);
doc.text("REPORTE DE EVALUACIÓN - SIMULADOR DE FRICCIÓN", 20, 20);
doc.setFontSize(12);
doc.text(`Estudiante: ${ultimo.nombre}`, 20, 40);
doc.text(`Fecha: ${ultimo.fecha}`, 20, 50);
doc.text(`Nota obtenida: ${ultimo.nota} / 5.0`, 20, 60);
doc.text(`Aciertos: ${ultimo.correctas} de 20 preguntas`, 20, 70);
doc.text("Interpretación:", 20, 85);
doc.setFontSize(11);
const interpretLines = doc.splitTextToSize(ultimo.interpretacion, 170);
doc.text(interpretLines, 20, 95);
doc.save(`Resultado_${ultimo.nombre.replace(/\s/g, "_")}.pdf`);
}

function exportarExcelEvaluacion(){
if(historialResultados.length === 0){ alert("No hay evaluación previa."); return; }
let csv = "Nombre,Fecha,Nota (5.0),Aciertos/20,Interpretación\n";
historialResultados.forEach(r => {
csv += `"${r.nombre}","${r.fecha}",${r.nota},${r.correctas}/20,"${r.interpretacion}"\n`;
});
const blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href = url;
a.download = `Evaluaciones_${new Date().toISOString().slice(0,19)}.csv`;
a.click();
URL.revokeObjectURL(url);
}

function animar(){ dibujarFisico(); requestAnimationFrame(animar); }

cargarEvaluacion();
cambiarModo();
actualizar();
animar();
</script>
